<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 160" width="100%" height="100%" role="img" aria-label="Currently Crafting Status Card">
  <defs>
    <linearGradient id="bg-craft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a101d" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>
    <linearGradient id="accent-bar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    
    /* Animated Equalizer Bars */
    .bar { transform-origin: bottom; animation: bounce 1.2s ease-in-out infinite alternate; }
    .b1 { animation-delay: 0.1s; }
    .b2 { animation-delay: 0.4s; }
    .b3 { animation-delay: 0.2s; }
    .b4 { animation-delay: 0.6s; }
    .b5 { animation-delay: 0.3s; }
    @keyframes bounce {
      0% { transform: scaleY(0.2); }
      50% { transform: scaleY(0.9); }
      100% { transform: scaleY(0.4); }
    }
    
    .pulse-green { animation: pulse-g 2s infinite; }
    @keyframes pulse-g {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }
  </style>

  <!-- Background Panel -->
  <rect width="900" height="160" rx="14" fill="url(#bg-craft)" stroke="#1e293b" stroke-width="1.5" />
  
  <!-- Window Header Bar -->
  <path d="M 0 14 Q 0 0 14 0 L 886 0 Q 900 0 900 14 L 900 38 L 0 38 Z" fill="#0f172a" opacity="0.6" />
  <line x1="0" y1="38" x2="900" y2="38" stroke="#1e293b" stroke-width="1" />
  
  <!-- Traffic Light Dots -->
  <circle cx="24" cy="19" r="4.5" fill="#ef4444" opacity="0.8" />
  <circle cx="39" cy="19" r="4.5" fill="#f59e0b" opacity="0.8" />
  <circle cx="54" cy="19" r="4.5" fill="#10b981" opacity="0.8" />
  
  <!-- Header Title -->
  <text x="76" y="23" class="mono" font-size="12" fill="#64748b">normanlinn / status-monitor.ts</text>
  
  <!-- Live Signal Pill -->
  <g transform="translate(680, 8)">
    <rect x="0" y="0" width="200" height="22" rx="11" fill="#064e3b" stroke="#059669" stroke-width="1" />
    <circle class="pulse-green" cx="14" cy="11" r="3.5" fill="#34d399" />
    <text x="24" y="15" class="mono" font-size="10.5" font-weight="600" fill="#6ee7b7">ONLINE · LOS ANGELES</text>
  </g>

  <!-- Body Content: Left Equalizer + Status Info -->
  <g transform="translate(32, 60)">
    <!-- Equalizer Visualizer -->
    <g transform="translate(0, 48)">
      <rect class="bar b1" x="0" y="-36" width="4.5" height="36" rx="2" fill="url(#accent-bar)" />
      <rect class="bar b2" x="8" y="-36" width="4.5" height="36" rx="2" fill="url(#accent-bar)" />
      <rect class="bar b3" x="16" y="-36" width="4.5" height="36" rx="2" fill="url(#accent-bar)" />
      <rect class="bar b4" x="24" y="-36" width="4.5" height="36" rx="2" fill="url(#accent-bar)" />
      <rect class="bar b5" x="32" y="-36" width="4.5" height="36" rx="2" fill="url(#accent-bar)" />
    </g>

    <!-- Info Column 1 -->
    <g transform="translate(56, 0)">
      <text x="0" y="14" class="mono" font-size="11" fill="#38bdf8" font-weight="600" letter-spacing="0.5">CURRENT OBSESSION</text>
      <text x="0" y="34" class="sans" font-size="14.5" font-weight="600" fill="#f1f5f9">Kinetic Spring Physics · Three.js Shaders · High-Fidelity UI</text>
      <text x="0" y="56" class="sans" font-size="12.5" fill="#94a3b8">Experimenting with motion curves that make interfaces feel weightless.</text>
    </g>

    <!-- Info Column 2: Availability / Stack -->
    <g transform="translate(580, 0)">
      <text x="0" y="14" class="mono" font-size="11" fill="#818cf8" font-weight="600" letter-spacing="0.5">LOOKING FORWARD</text>
      <text x="0" y="34" class="sans" font-size="14.5" font-weight="600" fill="#f1f5f9">Frontend &amp; Creative Tech</text>
      <text x="0" y="56" class="mono" font-size="12" fill="#64748b">Open for collaboration &amp; teams</text>
    </g>
  </g>
</svg>
