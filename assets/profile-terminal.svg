<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="title desc">
<title id="title">Zaw Lin Naing / Norman Linn</title>
<desc id="desc">An animated terminal introduction: frontend developer in Los Angeles, building web apps and interfaces with motion.</desc>
<style>
  .mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
  .intro{animation:arrive .55s ease-out both}
  .line{animation:arrive .45s ease-out both;animation-delay:var(--delay)}
  .typing{transform-origin:0 0;animation:type 1.55s steps(39,end) .65s both}
  .caret{animation:blink .72s step-end 5;animation-delay:2.2s;opacity:0}
  .rule{transform-origin:0 0;animation:draw .8s ease-out .1s both}
  @keyframes arrive{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
  @keyframes type{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  @keyframes blink{0%,100%{opacity:0}50%{opacity:1}}
  @keyframes draw{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  @media(prefers-reduced-motion:reduce){.intro,.line,.typing,.rule,.caret{animation:none}}
</style>
<defs><clipPath id="type-mask"><g transform="translate(70 0)"><rect class="typing" x="0" y="170" width="510" height="40"/></g></clipPath></defs>
<rect width="900" height="300" rx="16" fill="#181818"/>
<rect x="1" y="1" width="898" height="298" rx="15" fill="none" stroke="#414141"/>
<path d="M1 48h898" stroke="#414141"/>
<g fill="#97928b"><circle cx="26" cy="24" r="4"/><circle cx="43" cy="24" r="4"/><circle cx="60" cy="24" r="4"/></g>
<text x="84" y="30" class="mono" fill="#c1bdb6" font-size="14">normanlinn / profile</text>
<g class="intro"><text x="43" y="87" class="mono" fill="#d4b5a2" font-size="17">$ whoami</text>
<text x="41" y="150" fill="#f3efe8" font-family="Georgia,serif" font-size="58">Zaw Lin Naing</text></g>
<path class="rule" d="M43 169h814" stroke="#414141"/>
<text x="43" y="198" class="mono line" style="--delay:.55s" fill="#d4b5a2" font-size="19">&gt;</text>
<text x="70" y="198" class="mono" clip-path="url(#type-mask)" fill="#f3efe8" font-size="19">I build interfaces that move.</text>
<rect class="caret" x="403" y="181" width="8" height="20" fill="#d4b5a2"/>
<text x="43" y="235" class="mono line" style="--delay:2.1s" fill="#c1bdb6" font-size="17">Frontend development · Los Angeles</text>
<text x="43" y="269" class="mono line" style="--delay:2.35s" fill="#c1bdb6" font-size="15">TypeScript / React / Motion</text>
</svg>