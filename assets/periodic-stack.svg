<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 148" width="100%" height="100%" role="img" aria-label="Periodic Table of My Stack">
  <defs>
    <linearGradient id="pt-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a101d" />
      <stop offset="100%" stop-color="#04070e" />
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .elem { transition: transform 0.2s ease; }
  </style>

  <!-- Container Box -->
  <rect width="840" height="148" rx="14" fill="url(#pt-bg)" stroke="#1e293b" stroke-width="1.2" />

  <!-- Eyebrow Header -->
  <g transform="translate(24, 24)">
    <text x="0" y="0" class="mono" font-size="11" font-weight="600" fill="#38bdf8" letter-spacing="1.2">THE PERIODIC TABLE OF MY STACK</text>
    <text x="792" y="0" class="mono" font-size="10.5" fill="#64748b" text-anchor="end">FILTER: CORE / MOTION / SYSTEMS</text>
  </g>

  <!-- 10 Elemental Boxes in a Single Balanced Row -->
  <!-- Box width: 73px, Gap: 8px. Total = 10 * 73 + 9 * 8 = 730 + 72 = 802px. Left margin = (840 - 802) / 2 = 19px. -->
  <g transform="translate(19, 44)">

    <!-- 01: TypeScript (Cyan) -->
    <g transform="translate(0, 0)">
      <rect width="73" height="82" rx="8" fill="#0c1a2e" stroke="#0284c7" stroke-width="1.2" />
      <text x="8" y="18" class="mono" font-size="9" fill="#38bdf8" font-weight="700">01</text>
      <text x="36" y="47" class="mono" font-size="22" fill="#f0f9ff" font-weight="700" text-anchor="middle">Ts</text>
      <text x="36" y="68" class="sans" font-size="9.5" fill="#93c5fd" font-weight="600" text-anchor="middle">TypeScript</text>
    </g>

    <!-- 02: React (Cyan) -->
    <g transform="translate(81, 0)">
      <rect width="73" height="82" rx="8" fill="#0c1a2e" stroke="#0284c7" stroke-width="1.2" />
      <text x="8" y="18" class="mono" font-size="9" fill="#38bdf8" font-weight="700">02</text>
      <text x="36" y="47" class="mono" font-size="22" fill="#f0f9ff" font-weight="700" text-anchor="middle">Re</text>
      <text x="36" y="68" class="sans" font-size="9.5" fill="#93c5fd" font-weight="600" text-anchor="middle">React</text>
    </g>

    <!-- 03: Next.js (Slate/Ice) -->
    <g transform="translate(162, 0)">
      <rect width="73" height="82" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1.2" />
      <text x="8" y="18" class="mono" font-size="9" fill="#94a3b8" font-weight="700">03</text>
      <text x="36" y="47" class="mono" font-size="22" fill="#f8fafc" font-weight="700" text-anchor="middle">Nx</text>
      <text x="36" y="68" class="sans" font-size="9.5" fill="#cbd5e1" font-weight="600" text-anchor="middle">Next.js</text>
    </g>

    <!-- 04: Three.js (Purple) -->
    <g transform="translate(243, 0)">
      <rect width="73" height="82" rx="8" fill="#1e1138" stroke="#9333ea" stroke-width="1.2" />
      <text x="8" y="18" class="mono" font-size="9" fill="#c084fc" font-weight="700">04</text>
      <text x="36" y="47" class="mono" font-size="22" fill="#faf5ff" font-weight="700" text-anchor="middle">Th</text>
      <text x="36" y="68" class="sans" font-size="9.5" fill="#d8b4fe" font-weight="600" text-anchor="middle">Three.js</text>
    </g>

    <!-- 05: Framer Motion (Pink/Fuchsia) -->
    <g transform="translate(324, 0)">
      <rect width="73" height="82" rx="8" fill="#240c26" stroke="#c026d3" stroke-width="1.2" />
      <text x="8" y="18" class="mono" font-size="9" fill="#e879f9" font-weight="700">05</text>
      <text x="36" y="47" class="mono" font-size="22" fill="#fdf4ff" font-weight="700" text-anchor="middle">Fm</text>
      <text x="36" y="68" class="sans" font-size="9.5" fill="#f0abfc" font-weight="600" text-anchor="middle">Motion</text>
    </g>

    <!-- 06: TailwindCSS (Sky) -->
    <g transform="translate(405, 0)">
      <rect width="73" height="82" rx="8" fill="#082032" stroke="#0284c7" stroke-width="1.2" />
      <text x="8" y="18" class="mono" font-size="9" fill="#38bdf8" font-weight="700">06</text>
      <text x="36" y="47" class="mono" font-size="22" fill="#f0f9ff" font-weight="700" text-anchor="middle">Tw</text>
      <text x="36" y="68" class="sans" font-size="9.5" fill="#bae6fd" font-weight="600" text-anchor="middle">Tailwind</text>
    </g>

    <!-- 07: Node.js (Emerald) -->
    <g transform="translate(486, 0)">
      <rect width="73" height="82" rx="8" fill="#052416" stroke="#059669" stroke-width="1.2" />
      <text x="8" y="18" class="mono" font-size="9" fill="#34d399" font-weight="700">07</text>
      <text x="36" y="47" class="mono" font-size="22" fill="#ecfdf5" font-weight="700" text-anchor="middle">No</text>
      <text x="36" y="68" class="sans" font-size="9.5" fill="#a7f3d0" font-weight="600" text-anchor="middle">Node.js</text>
    </g>

    <!-- 08: Go (Cyan) -->
    <g transform="translate(567, 0)">
      <rect width="73" height="82" rx="8" fill="#082333" stroke="#0ea5e9" stroke-width="1.2" />
      <text x="8" y="18" class="mono" font-size="9" fill="#38bdf8" font-weight="700">08</text>
      <text x="36" y="47" class="mono" font-size="22" fill="#f0f9ff" font-weight="700" text-anchor="middle">Go</text>
      <text x="36" y="68" class="sans" font-size="9.5" fill="#bae6fd" font-weight="600" text-anchor="middle">Golang</text>
    </g>

    <!-- 09: C# (Violet) -->
    <g transform="translate(648, 0)">
      <rect width="73" height="82" rx="8" fill="#1b1236" stroke="#7c3aed" stroke-width="1.2" />
      <text x="8" y="18" class="mono" font-size="9" fill="#a78bfa" font-weight="700">09</text>
      <text x="36" y="47" class="mono" font-size="22" fill="#f5f3ff" font-weight="700" text-anchor="middle">C#</text>
      <text x="36" y="68" class="sans" font-size="9.5" fill="#c4b5fd" font-weight="600" text-anchor="middle">.NET Core</text>
    </g>

    <!-- 10: C++ (Blue) -->
    <g transform="translate(729, 0)">
      <rect width="73" height="82" rx="8" fill="#0b1b36" stroke="#2563eb" stroke-width="1.2" />
      <text x="8" y="18" class="mono" font-size="9" fill="#60a5fa" font-weight="700">10</text>
      <text x="36" y="47" class="mono" font-size="22" fill="#eff6ff" font-weight="700" text-anchor="middle">C++</text>
      <text x="36" y="68" class="sans" font-size="9.5" fill="#bfdbfe" font-weight="600" text-anchor="middle">Data Struct</text>
    </g>

  </g>
</svg>
