<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="120" viewBox="0 0 1200 120" role="img" aria-label="Thanks for stopping by">
  <defs>
    <linearGradient id="w" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1d4ed8"/>
      <stop offset=".5" stop-color="#0ea5e9"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
  <style>
    .wave { animation: slide 10s linear infinite; }
    .w2 { animation-duration: 16s; opacity: .45; }
    @keyframes slide { to { transform: translateX(-1200px); } }
    .t { font: 600 18px ui-monospace, "SF Mono", Menlo, Consolas, monospace; fill: #7dd3fc; animation: pulse 3s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: .45; } }
  </style>
  <g class="wave w2">
    <path fill="url(#w)" d="M0 80 Q150 50 300 80 T600 80 T900 80 T1200 80 T1500 80 T1800 80 T2100 80 T2400 80 V120 H0Z"/>
  </g>
  <g class="wave">
    <path fill="url(#w)" opacity=".8" d="M0 92 Q150 70 300 92 T600 92 T900 92 T1200 92 T1500 92 T1800 92 T2100 92 T2400 92 V120 H0Z"/>
  </g>
  <text class="t" x="600" y="40" text-anchor="middle">thanks for stopping by ✦ see you in the commits</text>
</svg>
