<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Zaw Lin Naing — Frontend Developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07101f"/>
      <stop offset="1" stop-color="#0b1a30"/>
    </linearGradient>
    <linearGradient id="text" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8;#22d3ee;#bae6fd;#38bdf8" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#22d3ee">
        <animate attributeName="stop-color" values="#22d3ee;#bae6fd;#38bdf8;#22d3ee" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="320" rx="24"/></clipPath>
  </defs>

  <style>
    .name { font: 800 64px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; letter-spacing: -1.5px; }
    .role { font: 600 22px ui-monospace, "SF Mono", Menlo, Consolas, monospace; fill: #e0f2fe; }
    .meta { font: 500 16px ui-monospace, "SF Mono", Menlo, Consolas, monospace; fill: #6b8bb0; }
    .rise { opacity: 0; animation: rise 1s cubic-bezier(.2,.8,.2,1) forwards; }
    .d1 { animation-delay: .15s; } .d2 { animation-delay: .45s; } .d3 { animation-delay: .75s; }
    @keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }

    .orb { animation: drift 14s ease-in-out infinite alternate; }
    .o2 { animation-duration: 18s; animation-delay: -6s; }
    .o3 { animation-duration: 22s; animation-delay: -3s; }
    @keyframes drift {
      0% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(80px, -30px) scale(1.15); }
      100% { transform: translate(-60px, 40px) scale(.95); }
    }

    /* cycling roles: each line shows for 1/4 of a 12s loop */
    .cycle { opacity: 0; animation: cycle 12s infinite; }
    .c2 { animation-delay: 3s; } .c3 { animation-delay: 6s; } .c4 { animation-delay: 9s; }
    @keyframes cycle {
      0% { opacity: 0; transform: translateY(10px); }
      4%, 21% { opacity: 1; transform: translateY(0); }
      25%, 100% { opacity: 0; transform: translateY(-10px); }
    }
    .caret { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }

    .ring { transform-origin: 1010px 160px; animation: spin 30s linear infinite; }
    .ring2 { animation-duration: 45s; animation-direction: reverse; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .float { animation: float 6s ease-in-out infinite; }
    @keyframes float { 50% { transform: translateY(-10px); } }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <g filter="url(#blur)" opacity=".55">
      <circle class="orb" cx="220" cy="80" r="140" fill="#0ea5e9"/>
      <circle class="orb o2" cx="900" cy="260" r="160" fill="#1d4ed8"/>
      <circle class="orb o3" cx="620" cy="0" r="120" fill="#06b6d4"/>
    </g>
    <rect width="1200" height="320" fill="url(#grid)"/>

    <!-- orbit decoration -->
    <g class="float">
      <g class="ring" fill="none" stroke-width="1.5">
        <circle cx="1010" cy="160" r="96" stroke="#38bdf8" stroke-opacity=".35" stroke-dasharray="4 10"/>
        <circle cx="1106" cy="160" r="6" fill="#38bdf8"/>
      </g>
      <g class="ring ring2" fill="none" stroke-width="1.5">
        <circle cx="1010" cy="160" r="62" stroke="#22d3ee" stroke-opacity=".45" stroke-dasharray="2 6"/>
        <circle cx="1010" cy="98" r="5" fill="#bae6fd"/>
      </g>
      <text x="1010" y="174" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="40" font-weight="700" fill="url(#text)">&lt;/&gt;</text>
    </g>

    <g transform="translate(72 0)">
      <text class="meta rise d1" x="0" y="96">~/normanlinn $ whoami</text>
      <text class="name rise d2" x="0" y="168" fill="url(#text)">Zaw Lin Naing</text>
      <g class="rise d3">
        <text class="role" x="0" y="216">&gt;</text>
        <g transform="translate(24 0)">
          <text class="role cycle" x="0" y="216">Frontend Developer</text>
          <text class="role cycle c2" x="0" y="216">React · Next.js · TypeScript</text>
          <text class="role cycle c3" x="0" y="216">Motion &amp; interaction nerd</text>
          <text class="role cycle c4" x="0" y="216">Building things in Los Angeles</text>
        </g>
        <text class="meta" x="0" y="262">📍 Los Angeles, CA   ·   ✦ normanlinn.github.io/portfolio</text>
      </g>
    </g>
  </g>
  <rect x=".5" y=".5" width="1199" height="319" rx="24" fill="none" stroke="#ffffff" stroke-opacity=".08"/>
</svg>
