<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 260" width="100%" height="100%" role="img" aria-label="LAXCommute Project Card">
  <defs>
    <linearGradient id="bg-lax" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1224" />
      <stop offset="100%" stop-color="#040812" />
    </linearGradient>
    <linearGradient id="glow-lax" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <radialGradient id="radar-pulse" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
  </defs>

  <style>
    .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .pulse-dot { animation: pulse 2s ease-in-out infinite; }
    .radar-sweep { transform-origin: 440px 90px; animation: rotate 8s linear infinite; }
    @keyframes pulse { 0%, 100% { opacity: 0.4; transform: scale(0.9); } 50% { opacity: 1; transform: scale(1.1); } }
    @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  </style>

  <!-- Card Background -->
  <rect width="540" height="260" rx="16" fill="url(#bg-lax)" stroke="#1e293b" stroke-width="1.5" />
  <rect width="540" height="260" rx="16" fill="url(#glow-lax)" />

  <!-- Radar / Airport Graphic -->
  <g opacity="0.65">
    <circle cx="440" cy="90" r="65" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="3 4" opacity="0.2" />
    <circle cx="440" cy="90" r="45" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="2 3" opacity="0.35" />
    <circle cx="440" cy="90" r="25" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.5" />
    <circle class="pulse-dot" cx="440" cy="90" r="14" fill="url(#radar-pulse)" />
    <circle cx="440" cy="90" r="4" fill="#38bdf8" />
    
    <!-- Flight Path Vector -->
    <path d="M375 140 Q 410 110 440 90 T 500 55" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6" />
    <!-- Mini Airplane icon at target -->
    <path d="M500 55 L508 51 L504 57 L506 63 L501 58 Z" fill="#38bdf8" opacity="0.9" />
  </g>

  <!-- Content -->
  <!-- Tag Pill -->
  <rect x="28" y="24" width="138" height="24" rx="12" fill="#0c2340" stroke="#1e3a5f" stroke-width="1" />
  <circle cx="40" cy="36" r="3.5" fill="#38bdf8" />
  <text x="50" y="40" class="mono" font-size="11" font-weight="600" fill="#38bdf8" letter-spacing="0.5">AIRPORT TRANSIT</text>

  <!-- Live Status Badge -->
  <rect x="176" y="24" width="76" height="24" rx="12" fill="#052e16" stroke="#166534" stroke-width="1" />
  <circle cx="188" cy="36" r="3" fill="#22c55e" class="pulse-dot" />
  <text x="198" y="40" class="mono" font-size="11" font-weight="600" fill="#4ade80">ONLINE</text>

  <!-- Title -->
  <text x="28" y="86" class="sans" font-size="24" font-weight="700" fill="#f8fafc">LAXCommute</text>

  <!-- Description -->
  <text x="28" y="118" class="sans" font-size="13.5" fill="#94a3b8" font-weight="400">
    <tspan x="28" dy="0">Real-time airport shuttle route-finding and arrivals,</tspan>
    <tspan x="28" dy="20">engineered for LAX employees navigating terminals.</tspan>
  </text>

  <!-- Tech Badges -->
  <g transform="translate(28, 172)">
    <rect x="0" y="0" width="70" height="22" rx="6" fill="#1e293b" />
    <text x="35" y="15" class="mono" font-size="10.5" fill="#cbd5e1" text-anchor="middle">Next.js</text>

    <rect x="78" y="0" width="86" height="22" rx="6" fill="#1e293b" />
    <text x="121" y="15" class="mono" font-size="10.5" fill="#cbd5e1" text-anchor="middle">TypeScript</text>

    <rect x="172" y="0" width="84" height="22" rx="6" fill="#1e293b" />
    <text x="214" y="15" class="mono" font-size="10.5" fill="#cbd5e1" text-anchor="middle">Transit API</text>

    <rect x="264" y="0" width="62" height="22" rx="6" fill="#1e293b" />
    <text x="295" y="15" class="mono" font-size="10.5" fill="#cbd5e1" text-anchor="middle">React</text>
  </g>

  <!-- Action Button / Link -->
  <g transform="translate(28, 212)">
    <rect x="0" y="0" width="124" height="28" rx="8" fill="url(#accent-cyan)" />
    <text x="62" y="18" class="sans" font-size="12" font-weight="700" fill="#040812" text-anchor="middle">Live App ↗</text>
    
    <text x="145" y="18" class="mono" font-size="12" fill="#64748b">employeeshuttlelax.com</text>
  </g>
</svg>
