    <!-- Center Tech Glyphs -->
    <circle cx="710" cy="172" r="28" fill="#0c172a" stroke="#38bdf8" stroke-width="1" opacity="0.8" />
    <text x="710" y="179" class="mono" font-size="19" font-weight="700" fill="#38bdf8" text-anchor="middle">&lt;/&gt;</text>
  </g>

  <!-- Primary Content Left -->
  <!-- Meta Eyebrow -->
  <text x="36" y="78" class="mono" font-size="11" font-weight="600" fill="#38bdf8" letter-spacing="1.8">ZLN / 001   ·   FRONTEND DEVELOPER &amp; CREATIVE TECHNOLOGIST</text>

  <!-- Name -->
  <text x="34" y="136" class="sans" font-size="52" font-weight="800" fill="url(#hero-text-glow)" letter-spacing="-1.2">Zaw Lin Naing</text>

  <!-- Editorial Subheading -->
  <text x="36" y="174" class="sans" font-size="20" font-weight="600" fill="#cbd5e1">
    Thoughtful code. <tspan class="serif" font-style="italic" font-weight="400" fill="#38bdf8">Human experiences that move.</tspan>
  </text>

  <!-- Prompt Command Bar -->
  <g transform="translate(36, 198)">
    <rect x="0" y="0" width="536" height="34" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <text x="14" y="22" class="mono" font-size="13" fill="#38bdf8" font-weight="700">&gt;</text>
    <text x="32" y="22" class="mono" font-size="12.5" fill="#f1f5f9">TypeScript · React · Next.js · Three.js · Framer Motion</text>
    <rect class="caret-blink" x="480" y="11" width="7" height="15" fill="#38bdf8" />
  </g>

  <!-- Bottom Details Bar -->
  <g transform="translate(36, 275)">
    <line x1="0" y1="0" x2="768" y2="0" stroke="#1e293b" stroke-width="1" />
    <text x="0" y="20" class="mono" font-size="10.5" fill="#64748b" letter-spacing="0.8">✈️ LAX AVIATION OPERATIONS → 💻 PRACTICAL FRONTEND ENGINEERING</text>
