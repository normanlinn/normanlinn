<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 310" width="100%" height="100%" role="img" aria-label="Zaw Lin Naing — Developer Pass 2026">
  <defs>
    <linearGradient id="hero-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b101b" />
      <stop offset="50%" stop-color="#070a12" />
      <stop offset="100%" stop-color="#04060a" />
    </linearGradient>
    <radialGradient id="hero-cyan-glow" cx="80%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="hero-blue-glow" cx="20%" cy="80%" r="45%">
      <stop offset="0%" stop-color="#1d4ed8" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0" />
    </radialGradient>
    <pattern id="hero-grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#38bdf8" stroke-width="0.75" stroke-opacity="0.04" />
    </pattern>
    <linearGradient id="hero-text-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .serif { font-family: "Georgia", serif; }
    .orbit-spin { transform-origin: 710px 172px; animation: spin 26s linear infinite; }
    .orbit-rev { transform-origin: 710px 172px; animation: spin-rev 38s linear infinite; }
    .pulse-dot { animation: pulse 2.2s ease-in-out infinite; }
    .caret-blink { animation: blink 1.1s steps(1) infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes spin-rev { to { transform: rotate(-360deg); } }
    @keyframes pulse { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }
    @keyframes blink { 50% { opacity: 0; } }
  </style>

  <!-- Outer Card Frame -->
  <rect width="840" height="310" rx="16" fill="url(#hero-bg)" stroke="#1e293b" stroke-width="1.2" />
  <rect width="840" height="310" rx="16" fill="url(#hero-cyan-glow)" />
  <rect width="840" height="310" rx="16" fill="url(#hero-blue-glow)" />
  <rect width="840" height="310" rx="16" fill="url(#hero-grid)" />

  <!-- Console Header Bar -->
  <path d="M 0 16 Q 0 0 16 0 L 824 0 Q 840 0 840 16 L 840 40 L 0 40 Z" fill="#0f172a" opacity="0.75" />
  <line x1="0" y1="40" x2="840" y2="40" stroke="#1e293b" stroke-width="1" />
  
  <!-- Traffic Dots -->
  <circle cx="24" cy="20" r="4.5" fill="#f87171" opacity="0.85" />
  <circle cx="39" cy="20" r="4.5" fill="#fbbf24" opacity="0.85" />
  <circle cx="54" cy="20" r="4.5" fill="#4ade80" opacity="0.85" />

  <!-- Window Tab Title -->
  <text x="76" y="24" class="mono" font-size="11.5" fill="#64748b">normanlinn / developer-pass-2026.ts</text>

  <!-- Live Status Signal Pill -->
  <g transform="translate(632, 9)">
    <rect x="0" y="0" width="186" height="22" rx="11" fill="#064e3b" stroke="#059669" stroke-width="1" />
    <circle class="pulse-dot" cx="12" cy="11" r="3.5" fill="#34d399" />
    <text x="22" y="15" class="mono" font-size="10" font-weight="600" fill="#6ee7b7">ONLINE · LOS ANGELES, CA</text>
  </g>

  <!-- Kinetic Orbital Graphic on Right -->
  <g opacity="0.7">
    <!-- Outer dashed orbit -->
    <g class="orbit-spin">
      <circle cx="710" cy="172" r="76" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4 8" opacity="0.35" />
      <circle cx="786" cy="172" r="4" fill="#38bdf8" />
    </g>
    <!-- Inner counter-orbit -->
    <g class="orbit-rev">
      <circle cx="710" cy="172" r="50" fill="none" stroke="#818cf8" stroke-width="1" stroke-dasharray="2 6" opacity="0.45" />
      <circle cx="710" cy="122" r="3.5" fill="#c084fc" />
